services:
  db:
    image: postgres:16-alpine
    container_name: sprachschule-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CLIENT_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CLIENT_PASSWORD:?CLIENT_PASSWORD is required in .env}
      POSTGRES_DB: ${CLIENT_DATABASE:-postgres}
    ports:
      - "${CLIENT_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLIENT_USERNAME:-postgres} -d ${CLIENT_DATABASE:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    container_name: sprachschule-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # Reach the database via the compose network, not localhost
      CLIENT_HOST: db
      CLIENT_PORT: 5432
      CLIENT_USERNAME: ${CLIENT_USERNAME:-postgres}
      CLIENT_PASSWORD: ${CLIENT_PASSWORD:?CLIENT_PASSWORD is required in .env}
      CLIENT_DATABASE: ${CLIENT_DATABASE:-postgres}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4200}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    container_name: sprachschule-client
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - server

volumes:
  db_data:
