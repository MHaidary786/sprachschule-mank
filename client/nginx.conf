# SPA built with baseHref "/sprachschule-mank/" but output files are flat
# in the web root -> expose them under that path via alias.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /sprachschule-mank/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the server container (same compose network)
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
