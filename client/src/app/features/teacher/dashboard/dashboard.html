<main class="p-6">
  <div class="mb-6">
    <h2 class="text-2xl font-bold">Guten Tag, {{ user?.name ?? 'Lehrkraft' }}!</h2>
    <p class="text-gray-500 mt-1">Hier ist Ihr Überblick als Lehrkraft.</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
    <div class="bg-white rounded-lg shadow p-5 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center">
        <mat-icon class="text-blue-600 text-2xl">school</mat-icon>
      </div>
      <div>
        <p class="text-gray-500 text-sm">Studenten</p>
        <p class="text-2xl font-bold">{{ studentCount ?? '–' }}</p>
      </div>
    </div>
    <div class="bg-white rounded-lg shadow p-5 flex items-center gap-4">
      <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center">
        <mat-icon class="text-green-600 text-2xl">menu_book</mat-icon>
      </div>
      <div>
        <p class="text-gray-500 text-sm">Meine Kurse</p>
        <p class="text-2xl font-bold text-gray-400">–</p>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-lg shadow p-5">
    <h3 class="text-lg font-semibold mb-4">Schnellzugriff</h3>
    <div class="flex flex-wrap gap-3">
      <a
        routerLink="/teacher/students"
        class="flex items-center gap-3 px-4 py-3 rounded-lg bg-gray-50 hover:bg-blue-50 border border-gray-200 hover:border-blue-200 transition"
      >
        <mat-icon class="text-gray-500">school</mat-icon>
        <span class="font-medium">Meine Schüler</span>
      </a>
    </div>
  </div>
</main>
