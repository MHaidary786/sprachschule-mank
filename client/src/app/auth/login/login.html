<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-brand-900 via-brand-800 to-brand-600 p-4 sm:p-6">
  <div class="w-full max-w-md">
    <div class="card overflow-hidden">
      <div class="flex flex-col items-center gap-3 px-6 pt-8 sm:px-10">
        <img src="assets/logo.png" alt="Logo Sprachschule Mank" class="h-16 sm:h-20" />
        <div class="text-center">
          <h1 class="text-2xl font-extrabold tracking-tight text-gray-900 sm:text-3xl">Willkommen zurück</h1>
          <p class="mt-1 text-sm text-gray-500">Melden Sie sich bei Ihrer Sprachschule an.</p>
        </div>
      </div>

      @if (error) {
        <div class="mx-6 mt-4 sm:mx-10">
          <div class="alert-error flex items-center gap-2">
            <mat-icon class="text-lg shrink-0">error_outline</mat-icon>
            <span>{{ error }}</span>
          </div>
        </div>
      }

      <form (ngSubmit)="login()" #loginForm="ngForm" novalidate class="space-y-5 p-6 sm:p-10 sm:pt-8">
        <!-- Username field -->
        <div class="form-group">
          <label for="username" class="label">Benutzername oder E-Mail</label>
          <input
            id="username"
            type="text"
            name="username"
            placeholder="z.B. max.mustermann"
            [(ngModel)]="credentials.email"
            required
            autocomplete="username"
            class="input"
          />
        </div>

        <!-- Password field -->
        <div class="form-group">
          <label for="password" class="label">Passwort</label>
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Ihr Passwort"
            [(ngModel)]="credentials.password"
            required
            autocomplete="current-password"
            class="input"
          />
        </div>

        <!-- Remember me -->
        <label for="remember" class="flex cursor-pointer items-center gap-2.5 text-sm text-gray-600">
          <input
            id="remember"
            type="checkbox"
            name="remember"
            [(ngModel)]="credentials.remember"
            class="checkbox"
          />
          Angemeldet bleiben
        </label>

        <button
          type="submit"
          [disabled]="!loginForm.valid"
          class="btn-primary w-full py-3 text-base"
        >
          Anmelden
        </button>
      </form>
    </div>

    <div class="mt-4 text-center">
      <a routerLink="/" class="inline-flex items-center gap-1.5 text-sm font-medium text-white/90 transition hover:text-white">
        <mat-icon class="text-base">arrow_back</mat-icon>
        Zurück zur Startseite
      </a>
    </div>
  </div>
</div>
