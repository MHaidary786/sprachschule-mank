<div class="min-h-screen flex flex-row bg-gray-50">
  <!-- Desktop sidebar -->
  <app-sidebar class="hidden lg:block sticky top-0 h-screen overflow-y-auto"></app-sidebar>

  <!-- Mobile drawer -->
  @if (sidebarOpen) {
    <div class="fixed inset-0 z-50 lg:hidden">
      <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm" (click)="closeSidebar()"></div>
      <div class="absolute left-0 top-0 h-full shadow-2xl">
        <app-sidebar (closeRequested)="closeSidebar()"></app-sidebar>
      </div>
    </div>
  }

  <div class="flex-1 flex flex-col min-w-0 overflow-x-hidden">
    <app-dashboard-navbar (openSidebar)="openSidebar()"></app-dashboard-navbar>
    <router-outlet></router-outlet>
  </div>
</div>
